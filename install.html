<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF1FF">
<meta name="robots" content="noindex">
<title>Install · Barq</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;color:#0A1D33;background:radial-gradient(80% 50% at 50% 0%,#CFEFFF 0%,#EAF1FF 55%,#fff 100%) #EAF1FF}
html[dir=rtl] body{font-family:Tajawal,"Readex Pro","SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif;line-height:1.85}
main{max-width:440px;margin:0 auto}
.logo{display:block;margin:8px auto 18px;width:84px;height:84px;border-radius:30%;background:#fff;box-shadow:0 18px 30px -16px rgba(27,68,187,.7),0 0 0 1px rgba(255,255,255,.9) inset}
h1{margin:0 0 6px;text-align:center;font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.02em;color:#0B1B3A}
html[dir=rtl] h1{letter-spacing:0}
.sub{margin:0 0 22px;text-align:center;color:#4A6076}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;min-height:44px;border:1px solid #D3DEF3;border-radius:999px;background:#fff;color:#1B44BB;font:inherit;font-weight:700;cursor:pointer;transition:background 180ms,color 180ms}
.tabs button[aria-selected=true]{background:#1B44BB;color:#fff;border-color:transparent}
ol{list-style:none;margin:0;padding:0;counter-reset:s}
li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;margin:0 0 12px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.85);border:1px solid #fff;box-shadow:0 18px 30px -24px rgba(27,68,187,.6)}
li::before{content:counter(s);flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#38D4FF,#2F6BFF);color:#fff;font-weight:800}
.ic{display:inline-block;vertical-align:-5px;margin:0 2px}
.note{margin:18px 0 0;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid #D3DEF3;color:#4A6076;font-size:14px}
a.b{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:20px;border-radius:999px;background:linear-gradient(180deg,#3DA6E8,#2F6BFF 55%,#1C80C4);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 16px 28px -14px rgba(47,107,255,.9)}
a.b:focus-visible,.tabs button:focus-visible{outline:3px solid #1B44BB;outline-offset:3px}
[hidden]{display:none!important}
@media (prefers-color-scheme:dark){body{color:#F2F7FC;background:radial-gradient(80% 50% at 50% 0%,#15508F 0%,#0F2F57 60%,#0A1D3A 100%) #0A1D3A}h1{color:#fff}.sub{color:rgba(242,247,252,.72)}.tabs button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}.tabs button[aria-selected=true]{background:#2F6BFF}li{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);box-shadow:none}.note{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:rgba(242,247,252,.8)}}</style>
</head>
<body>
<main>
<img class="logo" src="assets/brand/barq-mark-192.png" width="84" height="84" alt="">
<h1 id="t"></h1>
<p class="sub" id="s"></p>
<div class="tabs" role="tablist"><button type="button" role="tab" id="tI" aria-selected="true">iPhone</button><button type="button" role="tab" id="tA" aria-selected="false">Android</button></div>
<ol id="ios"></ol>
<ol id="and" hidden></ol>
<p class="note" id="n"></p>
<a class="b" id="go" href="./"></a>
</main>
<script>
(function(){
var SH='<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
var T={
 en:{t:'Install Barq',s:'Free, in 30 seconds, without the App Store. It opens full screen from its own icon and can send you notifications.',
  i:['Open this page in <b>Safari</b> on your iPhone.','Tap the Share button '+SH+' at the bottom of the screen.','Scroll and choose <b>Add to Home Screen</b>.','Tap <b>Add</b>, then open <b>Barq</b> from your home screen.'],
  a:['Open this page in <b>Chrome</b>.','Open the menu (⋮) at the top right.','Tap <b>Install app</b> or <b>Add to Home screen</b>.','Confirm, then open <b>Barq</b> from your home screen.'],
  n:'Notifications on iPhone only work once the app is installed this way (iOS 16.4 or later). Open it from the new icon, then allow notifications.',go:'Open Barq'},
 fr:{t:'Installer Barq',s:'Gratuit, en 30 secondes, sans App Store. L’app s’ouvre en plein écran depuis sa propre icône et peut vous envoyer des notifications.',
  i:['Ouvrez cette page dans <b>Safari</b> sur votre iPhone.','Touchez le bouton Partager '+SH+' en bas de l’écran.','Faites défiler et choisissez <b>Sur l’écran d’accueil</b>.','Touchez <b>Ajouter</b>, puis ouvrez <b>Barq</b> depuis votre écran d’accueil.'],
  a:['Ouvrez cette page dans <b>Chrome</b>.','Ouvrez le menu (⋮) en haut à droite.','Touchez <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.','Confirmez, puis ouvrez <b>Barq</b> depuis votre écran d’accueil.'],
  n:'Sur iPhone, les notifications ne fonctionnent qu’une fois l’app installée ainsi (iOS 16.4 ou plus). Ouvrez-la depuis la nouvelle icône, puis autorisez les notifications.',go:'Ouvrir Barq'},
 ar:{t:'ثبّت برق',s:'مجاني وفي 30 ثانية ودون App Store. يفتح بملء الشاشة من أيقونته الخاصة ويمكنه إرسال الإشعارات إليك.',
  i:['افتح هذه الصفحة في <b>Safari</b> على آيفون.','اضغط زر المشاركة '+SH+' أسفل الشاشة.','مرّر لأسفل واختر <b>إضافة إلى الشاشة الرئيسية</b>.','اضغط <b>إضافة</b> ثم افتح <b>برق</b> من الشاشة الرئيسية.'],
  a:['افتح هذه الصفحة في <b>Chrome</b>.','افتح القائمة (⋮) أعلى الشاشة.','اضغط <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.','أكّد ثم افتح <b>برق</b> من الشاشة الرئيسية.'],
  n:'على آيفون لا تعمل الإشعارات إلا بعد تثبيت التطبيق بهذه الطريقة (iOS 16.4 أو أحدث). افتحه من الأيقونة الجديدة ثم اسمح بالإشعارات.',go:'فتح برق'}
};
var l='en';
try{var q=(location.search.match(/[?&]lang=(en|fr|ar)/)||[])[1];var L=[].concat(navigator.languages||[],navigator.language||[]);
 for(var i=0;i<L.length;i++){var c=String(L[i]).toLowerCase().slice(0,2);if(T[c]){l=c;break}}
 var st=localStorage.getItem('yor_device_lang');if(T[st])l=st;if(q)l=q;}catch(e){}
var x=T[l],d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';
document.title=x.t+' · '+(l==='ar'?'برق':'Barq');
function $(i){return document.getElementById(i)}
$('t').textContent=x.t;$('s').textContent=x.s;$('n').textContent=x.n;$('go').textContent=x.go;
function fill(id,a){$(id).innerHTML=a.map(function(s){return '<li><span>'+s+'</span></li>'}).join('')}
fill('ios',x.i);fill('and',x.a);
function pick(ios){$('ios').hidden=!ios;$('and').hidden=ios;$('tI').setAttribute('aria-selected',ios);$('tA').setAttribute('aria-selected',!ios)}
$('tI').onclick=function(){pick(true)};$('tA').onclick=function(){pick(false)};
if(/android/i.test(navigator.userAgent))pick(false);
})();
</script>
</body>
</html>
