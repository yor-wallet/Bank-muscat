<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF8FF">
<meta name="robots" content="noindex">
<title>Page not found · Sanad Pay</title>
<base href="/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;color:#0A1D33;background:radial-gradient(80% 60% at 50% 20%,#CFEFFF 0%,#EAF8FF 45%,#fff 82%)}
html[dir=rtl] body{font-family:Tajawal,"SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif}
main{width:100%;max-width:380px;text-align:center}
.mk{display:block;margin:0 auto 14px;border-radius:30%;background:#fff;box-shadow:0 18px 30px -16px rgba(19,79,145,.7),0 0 0 1px rgba(255,255,255,.9) inset}
.art{display:block;width:min(240px,70%);height:auto;margin:0 auto 6px}
h1{margin:0 0 8px;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em;color:#102C4C}
html[dir=rtl] h1{letter-spacing:0}
p{margin:0 0 26px;color:#4A6076}
.code{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:#fff;border:1px solid #CFE6F5;color:#134F91;font-weight:800;font-size:13px;letter-spacing:.08em}
a.b,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:999px;background:linear-gradient(180deg,#3DA6E8,#2596DE 55%,#1C80C4);color:#fff;font:inherit;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 16px 28px -14px rgba(37,150,222,.9);transition:transform 180ms cubic-bezier(.16,1,.3,1)}
a.b:active,button:active{transform:scale(.97);transition-duration:90ms}
a.b:focus-visible,button:focus-visible{outline:3px solid #134F91;outline-offset:3px}
a.s{display:block;margin-top:12px;min-height:44px;line-height:44px;color:#134F91;font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){body{color:#F2F7FC;background:radial-gradient(80% 60% at 50% 20%,#15508F 0%,#0F2F57 50%,#0A1D3A 90%)}h1{color:#fff}p{color:rgba(242,247,252,.72)}.code{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#BFE9FB}a.s{color:#7ED8F6}}
@media (prefers-reduced-motion:no-preference){main{animation:in .45s cubic-bezier(.16,1,.3,1) both}@keyframes in{from{opacity:0;transform:translateY(14px)}}}</style>
</head>
<body>
<main role="main">
<img class="mk" src="/assets/brand/sanad-s-192.png" width="72" height="72" alt="">
<img class="art" src="/assets/illustrations/error.svg" width="240" height="180" alt="">
<span class="code">404</span>
<h1 id="t">Page not found</h1>
<p id="p">This page does not exist or has moved. Your account is safe.</p>
<a class="b" id="b" href="/">Back to Sanad Pay</a>
</main>
<script>
var T={
en:{t:'Page not found',p:'This page does not exist or has moved. Your account is safe.',b:'Back to Sanad Pay',s:''},
fr:{t:'Page introuvable',p:'Cette page n\'existe pas ou a été déplacée. Votre compte est en sécurité.',b:'Retour à Sanad Pay',s:''},
ar:{t:'الصفحة غير موجودة',p:'هذه الصفحة غير موجودة أو تم نقلها. حسابك بأمان.',b:'العودة إلى سند باي',s:''}};
(function(){var l='en';try{var L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(var i=0;i<L.length;i++){var c=String(L[i]).toLowerCase().slice(0,2);if(T[c]){l=c;break}}
 var st=localStorage.getItem('yor_device_lang');if(T[st])l=st;}catch(e){}
 var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';var x=T[l];
 document.title=x.t+' · '+(l==='ar'?'سند باي':'Sanad Pay');
 document.getElementById('t').textContent=x.t;document.getElementById('p').textContent=x.p;
 var b=document.getElementById('b');b.textContent=x.b;var s=document.getElementById('s');if(s)s.textContent=x.s;
})();
</script>
</body>
</html>
